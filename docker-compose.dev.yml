# MariaDB lokal untuk pengembangan & integration test (port 3307 agar tidak bentrok).
services:
  mariadb:
    image: mariadb:10.11
    container_name: studenthub-mariadb
    environment:
      MARIADB_ROOT_PASSWORD: root_dev
      TZ: UTC
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+00:00"]
    ports:
      - "127.0.0.1:3307:3306"
    volumes:
      - studenthub-mariadb:/var/lib/mysql
      - ./docker/mariadb-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  studenthub-mariadb:
