# Student Hub — PRODUKSI (studenthub.medialab.co.id -> 127.0.0.1:3030)
#
# Potongan tingkat `server` untuk folder ekstensi aaPanel:
#   /www/server/panel/vhost/nginx/extension/studenthub.medialab.co.id/studenthub.conf
# aaPanel meng-include `extension/<domain>/*.conf` DI DALAM blok `server` situs tersebut.
# Dipasang oleh `scripts/deploy/bootstrap-vps.sh nginx` (atau salin manual), lalu:
#   /www/server/nginx/sbin/nginx -t && /www/server/nginx/sbin/nginx -s reload
#
# Prasyarat situs aaPanel (lihat docs/deploy/BOOTSTRAP.md):
# - situs statis (PHP: "Static"), root = /www/wwwroot/studenthub.medialab.co.id (BUKAN folder aplikasi:
#   aaPanel mengubah pemilik root situs menjadi www dan menaruh .user.ini di sana);
# - JANGAN aktifkan fitur "Reverse proxy" / cache aaPanel (bentrok dengan `location /` di bawah);
# - SSL Let's Encrypt + "Force HTTPS" diaktifkan dari tab SSL.
#
# Port & path HARUS sama dengan ecosystem.config.cjs dan scripts/deploy/remote-deploy.sh.

client_max_body_size 12m;

# HSTS untuk semua respons. `add_header` TIDAK diwariskan ke location yang punya add_header sendiri,
# jadi /media/ mengulangnya.
add_header Strict-Transport-Security "max-age=31536000" always;

# Pengaturan proxy di tingkat server diwarisi oleh setiap location yang TIDAK mendefinisikan
# proxy_set_header sendiri. Jangan menambah proxy_set_header di dalam location mana pun; bila perlu,
# ulangi SEMUA header di bawah (terutama X-Real-IP: satu-satunya sumber IP klien bagi aplikasi).
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header Connection "";
proxy_cache off;
proxy_read_timeout 60s;

# Endpoint internal (cron tick) hanya dipanggil langsung ke 127.0.0.1:3030, tidak pernah lewat nginx.
location ^~ /api/internal/ {
    return 404;
}

# Berkas publik (banner iklan yang sudah disetujui) langsung dari disk; nama berkas acak & tak berubah.
location ^~ /media/ {
    alias /www/wwwroot/studenthub-storage/public/;
    try_files $uri =404;
    autoindex off;
    add_header Cache-Control "public, max-age=31536000, immutable";
    add_header X-Content-Type-Options "nosniff" always;
    add_header Content-Security-Policy "default-src 'none'; sandbox" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
}

# `^~` mencegah location regex bawaan aaPanel (*.js/*.css/gambar -> berkas statis di root situs)
# menyerobot request API dan aset Next.
location ^~ /api/ {
    proxy_pass http://127.0.0.1:3030;
}

location ^~ /_next/ {
    proxy_pass http://127.0.0.1:3030;
}

location / {
    proxy_pass http://127.0.0.1:3030;
}
